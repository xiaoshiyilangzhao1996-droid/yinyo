name: YINYO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=yinyo --cov-report=term-missing

      - name: Verify release metadata
        run: |
          python scripts/verify_release.py

      - name: Verify public tree
        run: |
          python scripts/verify_public_tree.py

      - name: Verify secret hygiene
        run: |
          python scripts/verify_secrets.py

      - name: Replay Feishu scenarios
        run: |
          python scripts/replay_scenarios.py
          python scripts/replay_scenarios.py --matrix

      - name: Verify package
        run: |
          pip install build
          python -m build

      - name: Clean install smoke
        run: |
          python scripts/verify_wheel.py --skip-build
