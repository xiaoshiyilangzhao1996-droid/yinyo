[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yinyo-agent"
version = "1.0.0rc1"
description = "YINYO - a Feishu-native agent with memory, evidence, and release gates"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Yinyo Contributors", email = "yinyo@example.com"},
]
keywords = ["ai", "agent", "feishu", "lark", "llm", "deepseek", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "lark-oapi>=1.4.0",
    "requests>=2.28",
    "scikit-learn>=1.3",
]

[project.scripts]
yinyo = "yinyo.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo"
Documentation = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo#readme"
Repository = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo.git"
Issues = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo/issues"
Changelog = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["yinyo*"]

[tool.setuptools.package-data]
yinyo = ["corpus/harness/*.json"]

[tool.setuptools.exclude-package-data]
yinyo = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
