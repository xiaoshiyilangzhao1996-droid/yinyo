[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yinyo-agent"
version = "7.0.0"
description = "YINYO (隐曜) — An Autonomous Feishu Agent That Learns"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "王正元", email = "wangzhengyuan@example.com"},
]
keywords = ["ai", "agent", "feishu", "lark", "llm", "deepseek", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.28",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo"
Documentation = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo#readme"
Repository = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo.git"
Issues = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo/issues"
Changelog = "https://github.com/xiaoshiyilangzhao1996-droid/yinyo/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["yinyo*"]

[tool.setuptools.package-data]
yinyo = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
